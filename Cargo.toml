[package]
name = "casement"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A native Wayland window an agent can drive: painted by us, served over a socket."

[dependencies]
# IntUI is a sibling checkout: its parser and its text form are reused, never copied.
intui-types = { path = "../intui/crates/intui-types" }
intui-layout = { path = "../intui/crates/intui-layout" }
intui-text = { path = "../intui/crates/intui-text" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
png = "0.17"
serde_json = "1"
cosmic-text = "0.19.0"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
